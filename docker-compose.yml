x-common: &common
  build: .
  env_file: .env
  restart: unless-stopped
  init: true

services:
  p1-sync:
    <<: *common
    command: ["python", "-m", "nuts.sync"]
    environment:
      OUTBOX_KIND: p1
    volumes:
      - ${DATA_DIR:-./data}/p1:/var/lib/nuts

  water-sync:
    <<: *common
    command: ["python", "-m", "nuts.sync"]
    environment:
      OUTBOX_KIND: water
    volumes:
      - ${DATA_DIR:-./data}/water:/var/lib/nuts

  p1:
    <<: *common
    profiles: ["p1"]
    command: ["python", "-m", "nuts.p1_capture"]
    volumes:
      - ${DATA_DIR:-./data}/p1:/var/lib/nuts
    devices:
      - ${P1_DEVICE:-/dev/ttyUSB0}:/dev/p1
    environment:
      P1_DEVICE: /dev/p1

  water:
    <<: *common
    profiles: ["water"]
    command: ["python", "-m", "nuts.water_gpio"]
    volumes:
      - ${DATA_DIR:-./data}/water:/var/lib/nuts
      - /proc/device-tree:/proc/device-tree:ro
    devices:
      - ${GPIO_CHIP:-/dev/gpiochip0}:/dev/gpiochip0

  publisher:
    <<: *common
    profiles: ["publish"]
    command: ["python", "-m", "nuts.publisher"]

  aggregate:
    <<: *common
    profiles: ["aggregate"]
    command: ["python", "-m", "nuts.aggregate"]

  pv-probe:
    build:
      context: .
      dockerfile: Dockerfile.pv
    env_file: .env
    profiles: ["pv"]
    command: ["python", "-m", "nuts.pv_probe"]
