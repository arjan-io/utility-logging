name: PV retry validation
on:
  push:
    branches: [codex/goodwe-daily-retry]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run PV collector tests
        run: PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_pv_capture.py' -v
