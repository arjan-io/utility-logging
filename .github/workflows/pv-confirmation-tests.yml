name: PV confirmation tests
on:
  pull_request:
    branches:
      - main
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run PV capture tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_pv_capture.py' -v
