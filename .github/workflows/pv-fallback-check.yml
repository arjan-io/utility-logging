name: PV fallback validation
on:
  push:
    branches: [codex/goodwe-daily-fallback]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run targeted tests
        run: |
          PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_aggregate*.py' -v
          PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_pv_capture.py' -v
          PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_publisher.py' -v
          PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_retention.py' -v
