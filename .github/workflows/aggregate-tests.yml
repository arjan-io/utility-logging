name: PV quality tests
on:
  push:
    branches:
      - codex/goodwe-daily-complete
  pull_request:
    branches:
      - main
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run PV tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_aggregate*.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_pv_capture.py' -v
# Validation is staged only; this workflow is excluded from main.
