name: Local simulation and unit tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Offline simulation
        run: PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m nuts.simulate
      - name: Unit tests
        run: PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
